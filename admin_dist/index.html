    <style>
      body {
        overflow: hidden;
        font-family: "Ony", sans-serif !important;
      }

      #q-app-loading {
        opacity: 1 !important;
        --background-color: #f0f0f0;
        --primary: #999999;
      }

      .initial-dark #q-app-loading {
        --background-color: #555555;
        --primary: #999999;
      }

      #app {
        opacity: 0;
      }

      #app.fade-in {
        animation: fadein 1000ms;
        opacity: 1;
      }

      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeout {
        from {
          opacity: 0.5;
        }
        to {
          opacity: 0;
        }
      }

      .z-max {
        z-index: 9998 !important;
      }

      .fullscreen {
        bottom: 0;
        left: 0;
        right: 0;
        top: 0;
        border-radius: 0 !important;
        max-height: 100vh;
        max-width: 100vw;
        z-index: 4999;
      }

      #q-app-loading .q-loading {
        color: var(--primary) !important;
        position: fixed !important;
        align-items: center;
        justify-content: center;
        display: flex;
      }

      #q-app-loading .q-loading__backdrop {
        background-color: var(--background-color) !important;
        bottom: 0;
        left: 0;
        opacity: 0.5;
        position: fixed;
        right: 0;
        top: 0;
        transition: background-color 0.28s;
        z-index: -1;
      }

      #q-app-loading .q-loading__box {
        border-radius: 4px;
        color: var(--primary);
        max-width: 450px;
        padding: 18px;
      }

      #q-app-loading .q-spinner {
        vertical-align: middle;
      }

      #q-app-loading .q-spinner-mat {
        animation: q-spin 2s linear infinite;
        transform-origin: center center;
      }

      #q-app-loading .q-spinner-mat .path {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
        animation: q-mat-dash 1.5s ease-in-out infinite;
      }

      @keyframes q-spin {
        0% {
          transform: rotate(0deg);
        }

        25% {
          transform: rotate(90deg);
        }

        50% {
          transform: rotate(180deg);
        }

        75% {
          transform: rotate(270deg);
        }

        to {
          transform: rotate(359deg);
        }
      }

      @keyframes q-mat-dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }

        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35px;
        }

        to {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124px;
        }
      }

      @font-face {
